<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    .line { stroke: #F5F6F8; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .ring { fill: none; stroke: #F5F6F8; stroke-width: 6; }
    .solid { fill: #F5F6F8; }
  </style>

  <!-- Lines between solid circles -->
  <polyline points="15,85 50,85 50,50 85,15" class="line" />

  <!-- Lines between hollow rings -->
  <!-- 0,0 to 1,0 -->
  <line x1="26" y1="15" x2="39" y2="15" class="line" />
  <!-- 0,0 to 0,1 -->
  <line x1="15" y1="26" x2="15" y2="39" class="line" />
  <!-- 2,1 to 2,2 -->
  <line x1="85" y1="61" x2="85" y2="74" class="line" />

  <!-- Solid Circles -->
  <circle cx="85" cy="15" r="11" class="solid" /> <!-- 2,0 -->
  <circle cx="50" cy="50" r="11" class="solid" /> <!-- 1,1 -->
  <circle cx="15" cy="85" r="11" class="solid" /> <!-- 0,2 -->
  <circle cx="50" cy="85" r="11" class="solid" /> <!-- 1,2 -->

  <!-- Hollow Rings -->
  <circle cx="15" cy="15" r="8" class="ring" /> <!-- 0,0 -->
  <circle cx="50" cy="15" r="8" class="ring" /> <!-- 1,0 -->
  <circle cx="15" cy="50" r="8" class="ring" /> <!-- 0,1 -->
  <circle cx="85" cy="50" r="8" class="ring" /> <!-- 2,1 -->
  <circle cx="85" cy="85" r="8" class="ring" /> <!-- 2,2 -->
</svg>
